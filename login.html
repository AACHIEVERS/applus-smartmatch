<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · SlideForge AI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f6f7fb;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#17181c;min-height:100vh;display:grid;place-items:center}.card{width:min(400px,calc(100% - 40px));background:#fff;padding:28px;border-radius:18px;border:1px solid #e7e8ed;box-shadow:0 20px 60px rgba(28,30,55,.12)}h1{margin:0 0 8px}p{color:#737783;font-size:13px;line-height:1.5}input{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border:1px solid #dfe2ea;border-radius:10px}button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:#5b5cf0;color:#fff;font-weight:700}button.alt{background:#fff;color:#17181c;border:1px solid #dfe2ea}#msg{font-size:12px;color:#737783;margin-top:10px}</style></head><body><div class="card"><h1>✦ SlideForge AI</h1><p>登录后进入 AI PPT 工作台。</p><input id="email" type="email" placeholder="邮箱"><input id="password" type="password" placeholder="密码"><button id="login">登录</button><button class="alt" id="signup">注册账号</button><div id="msg"></div></div><script>const sb=supabase.createClient('https://xndgplkeayyrtzqgphlj.supabase.co','sb_publishable_QQ_FVe4_XJA8vaLWg9FXPQ_PwamKnNa');const msg=document.getElementById('msg');sb.auth.getSession().then(({data})=>{if(data.session)location.href='/'});login.onclick=async()=>{msg.textContent='登录中…';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)msg.textContent=error.message;else location.href='/'};signup.onclick=async()=>{msg.textContent='注册中…';const {data,error}=await sb.auth.signUp({email:email.value.trim(),password:password.value});if(error)msg.textContent=error.message;else msg.textContent=data.session?'注册成功，正在进入…':'注册成功，请检查邮箱验证邮件。'};</script></body></html>
