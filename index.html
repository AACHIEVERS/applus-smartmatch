<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SlideForge AI — AI PPT 工作台</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#17181c;--muted:#737783;--line:#e7e8ed;--accent:#5b5cf0;--accent2:#7c3aed;--soft:#eef0ff;--shadow:0 12px 40px rgba(28,30,55,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-rows:64px 1fr}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#5b5cf0,#8b5cf6);display:grid;place-items:center;color:#fff;font-size:16px}.top-actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:650}.btn.primary{background:var(--text);color:#fff;border-color:var(--text)}.btn.purple{background:var(--accent);color:#fff;border-color:var(--accent)}.btn:hover{transform:translateY(-1px)}
.layout{display:grid;grid-template-columns:260px minmax(520px,1fr) 310px;min-height:calc(100vh - 64px)}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:20px 14px}.side-title{font-size:12px;color:var(--muted);font-weight:700;padding:10px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;color:#484b55}.nav button.active{background:var(--soft);color:var(--accent);font-weight:700}.new{margin:8px 10px 20px;width:calc(100% - 20px);padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700}.projects{margin-top:18px}.project{padding:10px;border-radius:9px;font-size:13px;display:flex;justify-content:space-between}.project:hover{background:#f5f5f8}
.main{padding:30px;overflow:auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.eyebrow{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.08em}.hero h1{font-size:30px;margin:5px 0}.hero p{color:var(--muted);margin:0}.canvas{background:#dfe1e8;border:1px solid #d4d6df;border-radius:14px;padding:28px;min-height:560px;display:grid;place-items:center;box-shadow:inset 0 1px #fff}.slide{width:min(820px,92%);aspect-ratio:16/9;background:#fff;border-radius:6px;box-shadow:0 16px 45px rgba(0,0,0,.13);padding:48px;position:relative;overflow:hidden}.slide:before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:linear-gradient(90deg,#5b5cf0,#8b5cf6)}.slide .shape{position:absolute;width:150px;height:150px;border-radius:28px;background:linear-gradient(135deg,#eef0ff,#f4eaff);right:-30px;bottom:-40px;transform:rotate(18deg)}.slide .tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef0ff;color:#5355d9;font-size:11px;font-weight:800}.slide h2{font-size:38px;line-height:1.12;margin:20px 0 12px;max-width:650px}.slide p{font-size:17px;color:#60636c;max-width:600px;line-height:1.6}.slide.layout-cover .shape{position:absolute;width:190px;height:190px;border-radius:40px;background:linear-gradient(135deg,#eef0ff,#f4eaff);right:-35px;bottom:-50px;transform:rotate(18deg)}.prompt{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}textarea{width:100%;border:0;outline:0;resize:none;min-height:58px}.prompt-row{display:flex;justify-content:space-between;align-items:center}.hint{font-size:12px;color:var(--muted)}
.right{background:#fff;border-left:1px solid var(--line);padding:20px;overflow:auto}.right h3{font-size:13px;margin:6px 0 12px}.drop{border:1.5px dashed #bfc2cf;border-radius:12px;padding:22px;text-align:center;background:#fafaff}.drop strong{display:block;margin-bottom:6px}.drop span{font-size:12px;color:var(--muted)}.drop input{display:none}.slides{margin-top:24px}.thumb{display:flex;gap:10px;align-items:center;padding:9px;border:1px solid transparent;border-radius:9px}.thumb.active{border-color:#cfd2ff;background:#f7f7ff}.mini{width:70px;aspect-ratio:16/9;background:#fff;border:1px solid #ddd;border-radius:4px;padding:7px;font-size:5px}.thumb div:last-child{font-size:12px}.status{margin-top:20px;padding:12px;border-radius:10px;background:#f5f6f9;font-size:12px;color:#626570}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#17181c;color:#fff;padding:11px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1050px){.layout{grid-template-columns:210px 1fr}.right{display:none}}@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{display:none}.main{padding:16px}.slide{padding:28px}.slide h2{font-size:27px}.canvas{padding:12px;min-height:390px}}
.ai-command{display:flex;gap:8px;margin:12px 0}.ai-command input{flex:1;padding:12px;border:1px solid #d8deea;border-radius:12px;font-size:14px}.ai-command button{border:0;border-radius:12px;padding:0 16px;background:#111827;color:#fff;font-weight:700;cursor:pointer}</style>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>
.layout-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}.card{padding:18px;border:1px solid #e5e7ef;border-radius:14px;background:#fafaff;display:flex;flex-direction:column;gap:8px}.card b{font-size:12px;color:#5b5cf0}.card strong{font-size:16px}.card span{font-size:11px;color:#777}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}.two-col>div{padding:20px;border-radius:14px;background:#f6f7ff}.two-col p{font-size:14px!important;margin:8px 0!important}.timeline{display:flex;gap:8px;margin-top:30px}.timeline>div{flex:1;padding:18px 12px;border-top:3px solid #5b5cf0;background:#f7f7fb;border-radius:8px}.timeline b{display:block;font-size:12px;color:#5b5cf0}.timeline strong{display:block;margin-top:12px;font-size:13px}.fake-chart{height:180px;display:flex;align-items:end;gap:18px;margin:25px 20px 0}.fake-chart i{flex:1;max-width:70px;background:linear-gradient(180deg,#7c3aed,#d9d7ff);border-radius:8px 8px 0 0;position:relative;min-height:20px}.fake-chart i b{position:absolute;top:-20px;font-size:10px}.fake-chart i span{position:absolute;bottom:-22px;font-size:10px}.slide.layout-cover h2{font-size:42px}.slide.layout-cards h2,.slide.layout-two-column h2,.slide.layout-timeline h2,.slide.layout-chart h2{font-size:30px}.slide.layout-chart .tag{margin-bottom:2px}
</style></head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">✦</div>SlideForge AI</div><div class="top-actions"><button class="btn" id="preview">预览</button><button class="btn" id="save">保存到本机</button><button class="btn primary" id="download">导出 PPTX</button></div></header>
<div class="layout">
<aside class="sidebar"><button class="new" id="newBtn">＋ 新建 AI PPT</button><div class="side-title">工作台</div><nav class="nav"><button class="active">✦ AI 创作</button><button>▣ 我的项目</button><button>◈ 模板中心</button><button>↺ 历史版本</button></nav><div class="projects"><div class="side-title">最近项目</div><div class="project">AI 产品发布会 <span>⋯</span></div><div class="project">公司年度报告 <span>⋯</span></div><div class="project">市场分析 2026 <span>⋯</span></div></div></aside>
<main class="main">
<div class="hero"><div><div class="eyebrow">AI PRESENTATION STUDIO</div><h1 id="title">AI 产品发布会</h1><p id="subtitle">用一句话创建、修改和美化你的 PPT</p></div><div><button class="btn" id="magic">✨ AI 美化</button></div></div>
<section class="canvas"><article class="slide" id="slide"><span class="tag">2026 PRODUCT LAUNCH</span><div id="slideContent"><h2 id="slideTitle">让复杂内容，变成令人记住的演示。</h2><p id="slideText">SlideForge AI 帮你从主题到完整 PPT，一次完成结构、内容与视觉设计。上传已有 PPT，也可以直接让 AI 帮你修改。</p></div><div class="shape"></div></article></section>
<section class="prompt"><div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"><button class="btn" id="addSlide">＋ 新增页</button><button class="btn" id="dupSlide">复制当前页</button><button class="btn" id="delSlide">删除当前页</button><button class="btn" id="editSlide">编辑当前页</button></div><textarea id="prompt" placeholder="告诉 AI 你想做什么，例如：做一份 10 页的 AI 行业趋势 PPT，面向投资人，风格专业简洁……"></textarea><div class="prompt-row"><span class="hint">Enter 发送 · 支持中文自然语言指令</span><button class="btn purple" id="generate">✦ 生成 / 修改</button></div></section>
</main>
<aside class="right"><h3>上传已有 PPT</h3><label class="drop" id="drop"><strong>拖入 .pptx 文件</strong><span>或点击选择文件 · AI 将分析你的页面</span><input type="file" id="file" accept=".pptx,.ppt"></label><div class="status" id="status">✨ AI 工作台已就绪<br>你可以创建新 PPT，或上传现有 PPT 后进行修改。</div><div class="slides"><h3>页面</h3><div id="thumbs"></div></div></aside>
</div></div>
<div class="toast" id="toast"></div><div id="previewModal" style="display:none;position:fixed;inset:0;background:rgba(10,12,20,.72);z-index:30;padding:5vh 5vw"><div style="height:90vh;background:#f1f2f6;border-radius:18px;padding:30px;display:grid;place-items:center;position:relative"><button id="closePreview" class="btn" style="position:absolute;right:18px;top:18px">关闭</button><div id="previewSlide" class="slide" style="width:min(1100px,90%);"></div></div></div>
<script>
const $=id=>document.getElementById(id), escapeHtml=s=>String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m])), toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
const defaultSlides=[
['封面','让复杂内容，变成令人记住的演示。','SlideForge AI 帮你从主题到完整 PPT，一次完成结构、内容与视觉设计。'],
['问题与机会','信息很多，但表达可以更简单。','把零散资料、观点和数据组织成清晰的故事线，让观众更快理解重点。'],
['解决方案','AI 帮你完成从大纲到视觉。','输入主题，AI 自动生成结构、内容、版式，并根据你的反馈持续修改。'],
['产品能力','创建、修改、美化，一站完成。','支持新建 PPT、上传已有 PPT、逐页修改、翻译、精简内容与视觉优化。'],
['下一步','准备好开始了吗？','输入你的主题，或者上传一个现有的 PPT，让 AI 直接开始工作。']
];
let current=0, slides=[...defaultSlides];
function render(){
  const s=slides[current]||['内容','未命名页面',''];
  const type=s[3]||((current===0)?'cover':'content');
  const content=$('slideContent'), slide=$('slide');
  slide.className='slide layout-'+type;
  content.innerHTML='';
  const tag=document.createElement('span');tag.className='tag';tag.textContent=type==='cover'?'2026 PRODUCT LAUNCH':type==='two-column'?'双栏观点':type==='timeline'?'TIMELINE':type==='cards'?'KEY POINTS':type==='chart'?'DATA INSIGHT':'CONTENT';
  content.appendChild(tag);
  const h=document.createElement('h2');h.id='slideTitle';h.textContent=s[1]||'未命名页面';content.appendChild(h);
  if(type==='cards'){
    const cards=document.createElement('div');cards.className='layout-cards';
    const items=(s[4]&&Array.isArray(s[4])?s[4]:[s[2]||'核心观点','关键价值','行动建议']);
    items.slice(0,3).forEach((x,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML='<b>'+escapeHtml(String(i+1).padStart(2,'0'))+'</b><strong>'+escapeHtml(x)+'</strong><span>重点信息与说明</span>';cards.appendChild(d)});content.appendChild(cards);
  }else if(type==='timeline'){
    const tl=document.createElement('div');tl.className='timeline';(s[4]||['阶段一：规划','阶段二：执行','阶段三：复盘']).slice(0,4).forEach((x,i)=>{tl.innerHTML+='<div><b>'+String(i+1).padStart(2,'0')+'</b><strong>'+escapeHtml(x)+'</strong></div>'});content.appendChild(tl);
  }else if(type==='chart'){
    const chart=document.createElement('div');chart.className='fake-chart';[42,68,55,84,73].forEach((v,i)=>chart.innerHTML+='<i style="height:'+v+'%"><b>'+v+'</b><span>Q'+(i+1)+'</span></i>');content.appendChild(chart);
  }else{
    const p=document.createElement('p');p.id='slideText';p.textContent=s[2]||'';content.appendChild(p);
  }
  if(type==='two-column'){
    const cols=document.createElement('div');cols.className='two-col';cols.innerHTML='<div><b>核心观点</b><p>'+escapeHtml(s[2]||'')+'</p></div><div><b>关键结论</b><p>用一句话提炼最值得记住的信息。</p></div>';content.appendChild(cols);
  }
  $('title').textContent=current===0?'AI 产品发布会':'AI 产品发布会 · '+(s[0]||'内容');
  const box=$('thumbs');box.innerHTML='';
  slides.forEach((x,i)=>{const d=document.createElement('div');d.className='thumb '+(i===current?'active':'');d.innerHTML='<div class="mini">'+escapeHtml((x[1]||'').slice(0,24))+'</div><div>'+(i+1)+'. '+escapeHtml(x[0]||'页面')+'</div>';d.onclick=()=>{current=i;render()};box.appendChild(d)})
}
async function runCommand(){const el=$('aiCommand');const p=(el.value||'').trim();if(!p){toast('请输入 AI 指令');return}$('prompt').value=p;$('status').innerHTML='⏳ AI Agent 正在理解并生成修改方案…';try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:p,slides})});const data=await r.json();if(!r.ok)throw new Error(data.error||'AI 服务暂不可用');(data.operations||[]).forEach(op=>{if(op.action==='delete'){const i=op.slide-1;if(i>=0&&i<slides.length)slides.splice(i,1)}else if(op.action==='add'){slides.push(['新增页面',op.title||'新增内容',op.body||''])}else if(op.action==='update'){const i=op.slide-1;if(i>=0&&i<slides.length){if(op.title!==undefined)slides[i][1]=op.title;if(op.body!==undefined)slides[i][2]=op.body}}});current=Math.max(0,Math.min(current,slides.length-1));render();$('status').innerHTML='🤖 '+(data.message||'AI 已完成修改')+'<br>可以继续输入下一条指令。';toast('AI Agent 已完成修改')}catch(e){$('status').innerHTML='⚠️ '+e.message+'<br>当前仍可使用本地编辑规则。';generate()}}
function localGenerate(p){
  const topic=p.length>40?p.slice(0,40)+'…':p;
  const count=(p.match(/(?:\\d+)\\s*页/)||[])[0];
  const n=count?Math.max(3,Math.min(12,parseInt(count))):6;
  const out=[['封面',topic,'这是根据你的主题生成的演示首页。','cover']];
  const sections=[
    ['背景与机会','梳理背景、趋势与核心机会','用清晰的背景说明为什么现在值得关注这个主题，并突出关键变化。'],
    ['核心问题','明确问题与用户需求','把复杂信息拆成几个容易理解的问题，帮助观众快速抓住重点。'],
    ['解决方案','把方案讲清楚、讲简单','围绕目标、方法和价值组织内容，让每一页都有明确的信息重点。'],
    ['产品与能力','展示关键能力与使用场景','用结构化内容说明主要功能、应用场景和带来的实际价值。'],
    ['数据与成果','用数据支撑核心观点','把重要指标、成果和趋势放在最需要被看到的位置。'],
    ['实施计划','从想法到落地的行动路径','按阶段拆解任务、负责人和关键里程碑，方便执行与跟进。'],
    ['总结与下一步','让观众知道接下来做什么','提炼三项最重要的结论，并给出清晰、可执行的下一步。']
  ];
  for(let i=1;i<n;i++){const s=sections[(i-1)%sections.length];const layouts=['two-column','cards','timeline','chart','content'];out.push([s[0],s[1],s[2],layouts[(i-1)%layouts.length],['目标与背景','核心价值','行动重点']])}
  return out;
}
function applyLocalCommand(p){
  const m=p.match(/第\\s*(\\d+)\\s*页/); const target=m?parseInt(m[1])-1:null;
  if(/删除/.test(p)&&target!==null&&target>=0&&target<slides.length){slides.splice(target,1);current=Math.min(current,slides.length-1);return '🗑️ 已删除第 '+(target+1)+' 页';}
  if(/新增|添加|增加/.test(p)&&/页/.test(p)){slides.push(['新增页面','新增内容','这是根据你的指令新增的页面。']);current=slides.length-1;return '✅ 已新增第 '+slides.length+' 页';}
  if(target!==null&&slides[target]){
    if(/精简|简短|减少/.test(p))slides[target][2]=slides[target][2].slice(0,Math.max(30,Math.floor(slides[target][2].length*.55)))+'。';
    if(/英文|翻译/.test(p)){slides[target][1]=slides[target][1].replace(/AI/g,'Artificial Intelligence');slides[target][2]='This slide has been translated into concise professional English.';}
    const tm=p.match(/(?:标题|题目)(?:改成|换成|设为|为)\\s*[“"「]?(.+?)[”"」]?(?:$|，|,)/);
    if(tm)slides[target][1]=tm[1].trim();
    current=target;return '✅ 已修改第 '+(target+1)+' 页';
  }
  if(/专业|商务/.test(p))slides.forEach(s=>s[1]='专业版 · '+s[1].replace(/^专业版 · /,''));
  if(/精简|简短|减少/.test(p))slides.forEach(s=>s[2]=s[2].slice(0,Math.max(30,Math.floor(s[2].length*.65)))+'。');
  return '✨ 已根据指令完成本地智能调整';
}
async function generate(){
  const p=$('prompt').value.trim();
  if(!p){toast('请先告诉我你想做什么');return}
  $('status').innerHTML='⚙️ 免费模式正在生成 PPT 结构…';
  await new Promise(r=>setTimeout(r,250));
  slides=localGenerate(p);current=0;render();
  $('status').innerHTML='✅ 免费版已生成 '+slides.length+' 页<br>所有内容在浏览器本地处理，无需 AI API。';
  toast('PPT 草稿已生成');
}
async function runCommand(){
  const p=$('prompt').value.trim();
  if(!p){toast('请输入修改指令');return}
  $('status').innerHTML='⚙️ 免费模式正在执行修改…';
  await new Promise(r=>setTimeout(r,180));
  const msg=applyLocalCommand(p);render();
  $('status').innerHTML=msg+'<br>免费版无需连接 AI API。';
  toast(msg.replace(/^[^\\u4e00-\\u9fff]+/,''));
}
$('addSlide').onclick=()=>{slides.push(['新增页面','点击“编辑当前页”修改标题','在这里输入这一页的内容。']);current=slides.length-1;render();toast('已新增页面')};
$('dupSlide').onclick=()=>{slides.splice(current+1,0,[...slides[current]]);current++;render();toast('已复制当前页')};
$('delSlide').onclick=()=>{if(slides.length<=1){toast('至少保留一页');return}slides.splice(current,1);current=Math.max(0,current-1);render();toast('已删除当前页')};
$('editSlide').onclick=()=>{const s=slides[current];const title=prompt('页面标题',s[1]);if(title===null)return;const body=prompt('页面正文',s[2]);if(body===null)return;s[1]=title.trim()||s[1];s[2]=body.trim()||s[2];render();toast('页面已更新')};
$('generate').onclick=generate;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();generate()}});
$('magic').onclick=()=>{slides.forEach((s,i)=>{if(i>0)s[2]=s[2].replace(/。?$/,'。');});$('slide').style.filter='saturate(1.15) contrast(1.03)';toast('已应用免费智能美化')};
$('newBtn').onclick=()=>{slides=[...defaultSlides];current=0;$('prompt').value='';render();toast('已新建 PPT')};
$('save').onclick=()=>{localStorage.setItem('slideforge-project',JSON.stringify({slides,title:$('title').textContent}));toast('已保存到本机浏览器')};
$('preview').onclick=()=>{const s=slides[current];$('previewSlide').innerHTML='<span class="tag">SLIDE '+String(current+1).padStart(2,'0')+'</span><h2>'+escapeHtml(s[1])+'</h2><p>'+escapeHtml(s[2])+'</p><div class="shape"></div>';$('previewModal').style.display='block'};$('closePreview').onclick=()=>{$('previewModal').style.display='none'};
$('download').onclick=async()=>{try{const pptx=new pptxgen();pptx.layout='LAYOUT_WIDE';pptx.author='SlideForge AI';pptx.subject='AI generated presentation';pptx.title=$('title').textContent;slides.forEach((s,i)=>{const sl=pptx.addSlide();sl.background={color:'FFFFFF'};sl.addShape(pptx.ShapeType.rect,{x:0,y:0,w:13.333,h:.12,fill:{color:'5B5CF0'},line:{color:'5B5CF0'}});sl.addText(s[0],{x:.7,y:.55,w:11.8,h:.35,fontSize:12,bold:true,color:'5B5CF0'});sl.addText(s[1],{x:.7,y:1.35,w:11.8,h:1.25,fontSize:28,bold:true,color:'17181C',margin:0,fit:'shrink'});if(s[3]==='cards'){(s[4]||['重点一','重点二','重点三']).slice(0,3).forEach((x,j)=>{sl.addShape(pptx.ShapeType.roundRect,{x:.7+j*4.05,y:3.05,w:3.55,h:1.5,rectRadius:.08,fill:{color:'F7F7FB'},line:{color:'E5E7EF'}});sl.addText(x,{x:.95+j*4.05,y:3.35,w:3.05,h:.5,fontSize:15,bold:true,color:'17181C',fit:'shrink'})})}else if(s[3]==='chart'){[42,68,55,84,73].forEach((v,j)=>sl.addShape(pptx.ShapeType.rect,{x:1+j*2.15,y:6.0-v/25,w:1.15,h:v/25,fill:{color:'7C3AED'},line:{color:'7C3AED'}}))}else{sl.addText(s[2],{x:.7,y:2.9,w:10.8,h:1.2,fontSize:16,color:'60636C',fit:'shrink'})}sl.addText(String(i+1).padStart(2,'0'),{x:11.8,y:6.8,w:.6,h:.25,fontSize:9,color:'A0A3AD',align:'right'});});await pptx.writeFile({fileName:'SlideForge-AI.pptx'});toast('PPTX 已生成并下载');}catch(e){console.error(e);toast('导出失败，请稍后重试')}};
$('file').onchange=async e=>{const f=e.target.files[0];if(f) await inspectPptx(f)};
async function inspectPptx(f){$('status').innerHTML='⏳ 正在读取 PPTX…';try{if(!/\.pptx$/i.test(f.name))throw new Error('format');const zip=await JSZip.loadAsync(await f.arrayBuffer());const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/i.test(n)).sort((a,b)=>(parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0])));const parsed=[];for(let i=0;i<names.length;i++){const xml=await zip.file(names[i]).async('string');const text=[...xml.matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map(m=>m[1]).join(' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');parsed.push(['第 '+(i+1)+' 页',text||'（未提取到文字）','AI 已读取这一页的文字内容，可以继续输入修改指令。']);}if(parsed.length){slides=parsed;current=0;render();$('status').innerHTML='✅ 已解析 '+parsed.length+' 页 PPT<br>已提取页面文字，可继续用自然语言提出修改要求。';toast('PPTX 解析成功')}else throw new Error('empty')}catch(err){console.error(err);$('status').innerHTML='⚠️ 暂时无法解析该文件。请确认上传的是标准 .pptx 文件。';toast('PPTX 读取失败')}}
$('drop').ondragover=e=>{e.preventDefault();$('drop').style.background='#f0f1ff'};$('drop').ondragleave=()=>{$('drop').style.background=''};$('drop').ondrop=async e=>{e.preventDefault();$('drop').style.background='';const f=e.dataTransfer.files[0];if(f) await inspectPptx(f)};
</script>
</body></html>
