name: Validate Medicine OS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: node --check medicine.js
      - name: Check HTML scripts
        run: |
          test -f index.html
          test -f medicine.js
